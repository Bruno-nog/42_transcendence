services:
  db:
    image: postgres:16
    container_name: transcendence_db
    environment:
      POSTGRES_USER: bruno
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: transcendence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bruno -d transcendence"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s
  backend:
    build: ./backend
    container_name: transcendence_backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: